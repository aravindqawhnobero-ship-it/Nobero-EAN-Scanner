
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NOBERO EAN SCANNER</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f3f5;
  margin: 0;
  padding: 15px;
  text-align: center;
}

.app {
  max-width: 450px;
  margin: 20px auto;
  padding: 20px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 2px 12px #ddd;
}

h2 {
  color: #222;
}

#reader {
  width: 100%;
  margin: 20px auto;
}

#result {
  padding: 15px;
  margin-top: 15px;
  background: #eee;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.success {
  background: #d9f7df !important;
  color: #126b29;
}

.error {
  background: #ffe0e0 !important;
  color: #b00020;
}

#count {
  margin-top: 15px;
  color: #555;
}

button {
  padding: 12px 22px;
  background: #222;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
  margin: 8px;
}
</style>
</head>

<body>

<div class="app">

<h2>NOBERO EAN SCANNER</h2>

<p>Garment Tag Barcode Scan செய்யவும்</p>

<div id="reader"></div>

<div id="result">Initializing Scanner...</div>

<div id="count">Scanned: 0</div>

<button onclick="restartScanner()">Restart Camera</button>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxvS8xQF6YKDhoVrcP0ij6rGedgNbb9zxjwMKcYzvq_fhkx9NdipLz6483zMu-vxg3g-g/exec";

let scanner = null;
let busy = false;
let scanCount = 0;

function showMessage(text, type) {
  const box = document.getElementById("result");
  box.innerText = text;
  box.className = type || "";
}

function saveEAN(ean) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "scannerCallback_" + Date.now() + "_" +
      Math.floor(Math.random() * 10000);

    const script = document.createElement("script");

    let completed = false;

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("Server Timeout"));
    }, 20000);

    function cleanup() {
      if (completed) return;
      completed = true;
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = function(response) {
      cleanup();

      if (response && response.ok) {
        resolve(response);
      } else {
        reject(new Error(
          response ? response.message : "Invalid Server Response"
        ));
      }
    };

    script.onerror = function() {
      cleanup();
      reject(new Error("Google Sheet Connection Failed"));
    };

    script.src =
      API_URL +
      "?ean=" + encodeURIComponent(ean) +
      "&callback=" + callbackName;

    document.body.appendChild(script);

  });

}

async function onScanSuccess(decodedText) {

  if (busy) return;

  const ean = String(decodedText).trim();

  if (!/^\d{8,14}$/.test(ean)) return;

  busy = true;

  showMessage("Saving EAN: " + ean, "");

  try {

    const response = await saveEAN(ean);

    scanCount++;

    document.getElementById("count").innerText =
      "Scanned: " + scanCount;

    showMessage(
      "SUCCESS! " + response.ean + " Saved",
      "success"
    );

  } catch(error) {

    showMessage("ERROR: " + error.message, "error");

  }

  setTimeout(() => {
    busy = false;
    showMessage("READY FOR NEXT SCAN", "");
  }, 1200);

}

async function startScanner() {

  if (typeof Html5Qrcode === "undefined") {
    showMessage(
      "Scanner Library Not Loaded. Check Internet Connection.",
      "error"
    );
    return;
  }

  showMessage("Starting Camera...", "");

  try {

    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },

      {
        fps: 15,
        qrbox: function(width, height) {
          return {
            width: Math.min(width * 0.90, 450),
            height: Math.min(height * 0.60, 180)
          };
        },
        disableFlip: false,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E
        ]
      },

      onScanSuccess

    );

    showMessage("CAMERA READY - SCAN BARCODE", "success");

  } catch(error) {

    showMessage("CAMERA ERROR: " + error, "error");

  }

}

async function restartScanner() {

  if (scanner) {
    try {
      await scanner.stop();
      scanner.clear();
    } catch(error) {}
  }

  scanner = null;
  startScanner();

}

window.addEventListener("load", function() {

  showMessage("Checking Scanner Library...", "");

  setTimeout(startScanner, 300);

});

</script>

</body>
</html>
