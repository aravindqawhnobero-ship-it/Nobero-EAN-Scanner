
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>NOBERO EAN SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f3f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .app {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 12px #ddd;
    }

    h2 { color: #222; }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #result {
      padding: 15px;
      background: #eee;
      border-radius: 8px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .success {
      background: #d9f7df !important;
      color: green;
    }

    .error {
      background: #ffe0e0 !important;
      color: #b00020;
    }

    #count {
      margin-top: 15px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="app">

  <h2>NOBERO EAN SCANNER</h2>

  <p>Garment Tag Barcode Scan செய்யவும்</p>

  <div id="reader"></div>

  <div id="result">Connecting...</div>

  <div id="count">Scanned: 0</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxvS8xQF6YKDhoVrcP0ij6rGedgNbb9zxjwMKcYzvq_fhkx9NdipLz6483zMu-vxg3g-g/exec";

let scanner;
let busy = false;
let scanCount = 0;

function message(text, type) {
  const box = document.getElementById("result");
  box.innerText = text;
  box.className = type || "";
}

function saveEAN(ean) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "scannerCallback_" + Date.now() + "_" +
      Math.floor(Math.random() * 10000);

    const script = document.createElement("script");

    let finished = false;

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("Server Timeout. Try Again."));
    }, 20000);

    function cleanup() {
      if (finished) return;
      finished = true;
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = function(response) {
      cleanup();

      if (response.ok) {
        resolve(response);
      } else {
        reject(new Error(response.message));
      }
    };

    script.onerror = function() {
      cleanup();
      reject(new Error("Google Sheet Connection Failed"));
    };

    script.src =
      API_URL +
      "?ean=" + encodeURIComponent(ean) +
      "&callback=" + callbackName;

    document.body.appendChild(script);

  });

}

async function onScanSuccess(decodedText) {

  if (busy) return;

  const ean = decodedText.trim();

  if (!/^\d{8,14}$/.test(ean)) return;

  busy = true;

  message("Saving: " + ean, "");

  try {

    const response = await saveEAN(ean);

    scanCount++;

    document.getElementById("count").innerText =
      "Scanned: " + scanCount;

    message(
      "✓ " + response.ean + " Saved Successfully",
      "success"
    );

  } catch(error) {

    message("Error: " + error.message, "error");

  }

  setTimeout(() => {
    busy = false;
    message("Ready for Next Scan", "");
  }, 1200);

}


scanner.start(
  { facingMode: "environment" },
  {
    fps: 15,
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      return {
        width: Math.min(viewfinderWidth * 0.90, 450),
        height: Math.min(viewfinderHeight * 0.65, 180)
      };
    },
    aspectRatio: 1.777,
    disableFlip: false,
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E
    ]
  },
  onScanSuccess
).then(() => {
  message("Camera Ready - Keep Barcode Inside Box", "success");
}).catch(error => {
  message("Camera Error: " + error, "error");
});

window.onload = startScanner;

</script>

</body>
</html>
